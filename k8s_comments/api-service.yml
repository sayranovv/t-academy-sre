# ДЗ 2. Постоянная внутренняя точка обращения к репликам API.
# Nginx обращается к api.default.svc.cluster.local:8000.
# Service выбирает Pod по app: api, а не по имени Deployment.
# Service распределяет соединения; каждый запрос не выполняется на обеих репликах.
# Источник: k8s/api-service.yml

---
# Версия API Kubernetes для данного типа объекта.
apiVersion: v1
# Тип ресурса Kubernetes.
kind: Service
# Имя, namespace и метки самого объекта.
metadata:
  name: api
# Желаемая конфигурация объекта.
spec:
  # Порты: у контейнера декларация, у Service правила направления трафика.
  ports:
    # Порт Service, к которому обращаются клиенты внутри кластера.
    - port: 8000
      # Порт или имя порта целевого контейнера.
      targetPort: 8000
  # Выбор Pod по меткам. Должен соответствовать labels целевых Pod.
  selector:
    app: api
  # Внутренний адрес кластера; доступ с ноутбука здесь через port-forward.
  type: ClusterIP
...
