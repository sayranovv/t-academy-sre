# ДЗ 2. Заявка на постоянный том для PostgreSQL; Pod подключает её по имени db-pvc.
# PVC связывается с PV; в учебном minikube том выделяет provisioner StorageClass по умолчанию.
# Жизненный цикл тома отделён от Pod: замена Pod не означает удаление данных.
# PVC не резервная копия и не гарантия сохранности при потере локального узла.
# Источник: k8s/db-pvc.yml

---
# Версия API Kubernetes для данного типа объекта.
apiVersion: v1
# Тип ресурса Kubernetes.
kind: PersistentVolumeClaim
# Имя, namespace и метки самого объекта.
metadata:
  name: db-pvc
# Желаемая конфигурация объекта.
spec:
  # Режим доступа к запрашиваемому хранилищу.
  accessModes:
    # Запись с одного узла; это не строгая гарантия одного Pod и не репликация данных.
    - ReadWriteOnce
  # Для контейнера — CPU/память; для PVC — ёмкость хранилища.
  resources:
    # Запрашиваемые ресурсы; контейнерные requests учитывает scheduler.
    requests:
      # Запрашиваемая ёмкость тома (Gi — гибибайты).
      storage: 1Gi
...
