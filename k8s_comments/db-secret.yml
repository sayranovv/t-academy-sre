# Безопасный пример Secret: реальное значение локального пароля не копировалось.
# API, PostgreSQL и Job используют объект db-secret и ключ password.
# stringData принимает обычные строки; Secret не означает автоматическое шифрование.
# REPLACE_WITH_LOCAL_PASSWORD — заглушка для чтения, а не рабочие учётные данные.
# Источник: k8s/db-secret.yml.example

# Версия API Kubernetes для данного типа объекта.
apiVersion: v1
# Тип ресурса Kubernetes.
kind: Secret
# Имя, namespace и метки самого объекта.
metadata:
  name: db-secret
# Произвольный набор секретных ключей и значений.
type: Opaque
# Строковые значения Secret; не выводить рабочие секреты в Git/логи.
stringData:
  # Учебная заглушка вместо реального локального пароля.
  password: REPLACE_WITH_LOCAL_PASSWORD
