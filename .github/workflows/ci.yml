name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_DB: equipment_test
          POSTGRES_USER: equipment
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equipment -d equipment_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DB_HOST: localhost
      DB_NAME: equipment_test
      DB_USER: equipment
      DB_PASSWORD: test_only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-e2e
      - if: always()
        run: docker compose --profile test down -v

  production-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: POSTGRES_PASSWORD=ci_only docker compose -f compose.production.yaml build
      - run: POSTGRES_PASSWORD=ci_only WEB_PORT=18080 docker compose -f compose.production.yaml up -d --wait --wait-timeout 180 --scale api=2
      - run: curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:18080/health/ready
      - run: curl --fail http://127.0.0.1:18080/equipment/1
      - if: always()
        run: POSTGRES_PASSWORD=ci_only WEB_PORT=18080 docker compose -f compose.production.yaml down -v
