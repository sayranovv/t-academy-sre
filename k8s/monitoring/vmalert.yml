apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert-deployment
  labels:
    app: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8880"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.155.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8880
          args:
            - -rule=/etc/vmalert/alerts.yml
            - -datasource.url=http://vm-single-victoria-metrics-single-server.monitoring.svc:8428
            - -notifier.url=http://alertmanager-service:9093
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert-service
spec:
  type: ClusterIP
  selector:
    app: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: 8880
