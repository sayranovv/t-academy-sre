apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      app_logs:
        type: kubernetes_logs
        self_node_name: "${VECTOR_SELF_NODE_NAME}"
        extra_field_selector: "metadata.namespace=default"
        extra_label_selector: "app in (api,web)"

    transforms:
      parse_application_json:
        type: remap
        inputs:
          - app_logs
        source: |
          parsed, err = parse_json(.message)

          if err == null && is_object(parsed) {
            . = merge(., object!(parsed))
            .log_format = "json"
          } else {
            .log_format = "text"
            .level = "unknown"
          }

          if !exists(."service.name") {
            if .kubernetes.pod_labels.app == "api" {
              ."service.name" = "equipment-api"
            } else {
              ."service.name" = "equipment-web"
            }
          }

    sinks:
      victoria_logs:
        type: elasticsearch
        inputs:
          - parse_application_json
        endpoints:
          - http://victoria-logs.logging.svc.cluster.local:9428/insert/elasticsearch/
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: service.name,kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name
