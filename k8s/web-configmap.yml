---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 512;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        server_tokens off;
        sendfile on;
        keepalive_timeout 30s;
        client_max_body_size 32k;
        client_body_temp_path /tmp/nginx/client_temp;
        proxy_temp_path /tmp/nginx/proxy_temp;

        map $status $access_level {
            default info;
            ~^4 warning;
            ~^5 error;
        }

        log_format json_combined escape=json
                '{"timestamp":"$time_iso8601",'
                '"level":"$access_level",'
                '"message":"HTTP request completed",'
                '"service.name":"equipment-web",'
                '"request_id":"$request_id",'
                '"method":"$request_method",'
                '"path":"$request_uri",'
                '"status":$status,'
                '"request_time":$request_time,'
                '"bytes":$body_bytes_sent}';
        access_log /dev/stdout json_combined;
        error_log /dev/stderr warn;

        resolver 10.96.0.10 valid=5s ipv6=off;

        server {
            listen 8080;
            root /usr/share/nginx/html;
            error_page 413 = @payload_too_large;

            location @payload_too_large {
                default_type application/json;
                return 413 '{"error":{"code":"payload_too_large","message":"Тело запроса превышает допустимый размер","details":[]},"request_id":"$request_id"}';
            }

            location ~ ^/(api/|health/|docs$|openapi\.json$) {
                set $api http://api.default.svc.cluster.local:8000;
                proxy_pass $api;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                proxy_connect_timeout 3s;
                proxy_send_timeout 20s;
                proxy_read_timeout 20s;
            }

            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
...
