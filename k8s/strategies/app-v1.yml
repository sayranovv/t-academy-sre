apiVersion: v1
kind: Service
metadata:
  name: api-v1
  namespace: default
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api-strategies
    version: "0.1.5"
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
  namespace: default
  labels:
    app: api-strategies
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-strategies
      version: "0.1.5"
  template:
    metadata:
      labels:
        app: api-strategies
        version: "0.1.5"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api-container
          image: t-academy-equipment-api:0.1.5
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "equipment"
            - name: DB_USER
              value: "equipment"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
