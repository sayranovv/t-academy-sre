apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: default
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
          method: GET
      backendRefs:
        - name: api-v1
          port: 8000
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: api-v2
              port: 8000
