name: t-academy-sre

x-backend: &backend
  image: t-academy-equipment-api:dev
  build:
    context: ./backend
    target: development
  environment: &backend-env
    DB_HOST: db
    DB_PORT: 5432
    DB_NAME: ${POSTGRES_DB:-equipment}
    DB_USER: ${POSTGRES_USER:-equipment}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-equipment_local}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
    DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
    DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
    DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-2000}
    DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
    READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20}
    MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-32768}
  volumes:
    - ./backend/app:/app/app
    - ./backend/migrations:/app/migrations
    - ./backend/tests:/app/tests
    - ./backend/alembic.ini:/app/alembic.ini:ro
  init: true

services:
  db-test:
    image: postgres:18.3-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: equipment_test
      POSTGRES_USER: equipment
      POSTGRES_PASSWORD: test_only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U equipment -d equipment_test']
      interval: 1s
      timeout: 3s
      retries: 30

  test-api:
    <<: *backend
    profiles: [test]
    environment: &test-db-env
      <<: *backend-env
      DB_HOST: db-test
      DB_NAME: equipment_test
      DB_USER: equipment
      DB_PASSWORD: test_only
    command: [sh, -c, 'alembic upgrade head && pytest']
    depends_on:
      db-test:
        condition: service_healthy

  test-migrate:
    <<: *backend
    profiles: [test]
    environment: *test-db-env
    command: [alembic, upgrade, head]
    depends_on:
      db-test:
        condition: service_healthy

  test-seed:
    <<: *backend
    profiles: [test]
    environment: *test-db-env
    command: [python, -m, app.seed]
    depends_on:
      test-migrate:
        condition: service_completed_successfully

  e2e-api:
    <<: *backend
    profiles: [test]
    environment: *test-db-env
    command: [python, -m, app.run]
    depends_on:
      test-seed:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 15

  db:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equipment}
      POSTGRES_USER: ${POSTGRES_USER:-equipment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equipment_local}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: [python, -m, app.run]
    environment:
      <<: *backend-env
      RELOAD: 'true'
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  web: &web
    image: t-academy-equipment-web:dev
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    init: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  e2e-web:
    <<: *web
    profiles: [test]
    environment:
      API_PROXY_TARGET: http://e2e-api:8000
    ports:
      - '127.0.0.1:5174:5173'
    depends_on:
      e2e-api:
        condition: service_healthy

volumes:
  postgres_data:
