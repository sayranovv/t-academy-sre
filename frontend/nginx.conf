worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 32k;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        error_page 413 = @payload_too_large;

        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"payload_too_large","message":"Тело запроса превышает допустимый размер","details":[]},"request_id":"$request_id"}';
        }

        location ~ ^/(api/|health/|docs$|openapi\.json$) {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
