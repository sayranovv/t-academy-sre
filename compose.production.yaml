name: t-academy-sre-production

x-api-environment: &api-environment
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-equipment}
  DB_USER: ${POSTGRES_USER:-equipment}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
  DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-2000}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
  READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-32768}

x-api: &api
  image: t-academy-equipment-api:0.1.0
  build:
    context: ./backend
    target: production
  environment: *api-environment
  init: true
  stop_grace_period: 30s

services:
  db:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equipment}
      POSTGRES_USER: ${POSTGRES_USER:-equipment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_production_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    command: [python, -m, app.run]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  web:
    image: t-academy-equipment-web:0.1.0
    build:
      context: ./frontend
      target: production
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    init: true
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/live]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_production_data:
